[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "F401"]
"*/management/commands/*" = ["E501"]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests.py", "*/tests_*.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true